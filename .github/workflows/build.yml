name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack bundle.txt into project files
        run: |
          python3 - <<'PY'
          import re, os, base64
          t = open('bundle.txt', encoding='utf-8').read()
          parts = re.split(r'^=====(FILE|B64) (.+?)=====\n', t, flags=re.M)
          for i in range(1, len(parts), 3):
              kind, p, body = parts[i], parts[i + 1], parts[i + 2]
              os.makedirs(os.path.dirname(p) or '.', exist_ok=True)
              if kind == 'B64':
                  open(p, 'wb').write(base64.b64decode(body))
              else:
                  open(p, 'w', encoding='utf-8').write(body)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: StudentPlanner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
